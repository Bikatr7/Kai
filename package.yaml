name: kai-lang
version: 0.0.4.6
synopsis: A functional-first scripting language with static typing
description: Kai combines static type inference, first-class functions, algebraic data types, and scripting tools in an interpreter implemented in Haskell.
category: Language
github: Bikatr7/Kai
homepage: https://github.com/bikatr7/kai
license: AGPL-3.0-only
author: Kaden Bilyeu (Bikatr7)
maintainer: bikatr7@proton.me

extra-source-files:
  - '*.md'
  - package.yaml
  - stack.yaml
  - stack.yaml.lock
  - Makefile
  - .hlint.yaml
  - .github/workflows/*.yml
  - scripts/*
  - benchmarks/README.md
  - test/*.py
  - test/fixtures/*.sh
  - test/fixtures/*.json
  - tests/**/*.kai
  - examples/**/*.kai
  - website/static/*

dependencies:
  - base >= 4.7 && < 5
  - containers
  - text
  - megaparsec
  - parser-combinators
  - mtl
  - split
  - deepseq
  - filepath
  - directory
  - process

library:
  source-dirs: src
  exposed-modules:
    - CLI
    - Diagnostics
    - ModuleSystem
    - Syntax
    - Parser
    - Evaluator
    - Evaluator.Errors
    - TypeChecker

executables:
  kai-website:
    main: Main.hs
    source-dirs: website
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - directory
      - text
    when:
      - condition: os(windows)
        then:
          dependencies: []
          buildable: false
        else:
          dependencies:
            - yesod
            - yesod-core
            - yesod-static
            - yesod-form
            - shakespeare
            - warp
          buildable: true

  kai:
    main: Main.hs
    source-dirs: app
    dependencies:
      - kai-lang
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

tests:
  kai-test:
    main: Spec.hs
    source-dirs: 
      - test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -with-rtsopts=-K64M
    dependencies:
      - hspec
      - hspec-core
      - QuickCheck
      - kai-lang
      - directory
      - filepath
      - containers
      - process
      - aeson
      - bytestring
      - text
    build-tools:
      - hspec-discover

benchmarks:
  kai-bench:
    main: Bench.hs
    source-dirs: benchmarks
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -O2
    dependencies:
      - kai-lang
      - containers
      - text
      - weigh
      - criterion
