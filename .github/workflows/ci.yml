name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.4.8'
        enable-stack: true
        stack-version: 'latest'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.stack
          .stack-work
        key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
    
    - name: Run Haskell test suite
      run: stack test

    - name: Validate benchmark programs
      run: stack bench --benchmark-arguments="--iters 1"

    - name: Build binary
      run: |
        stack build :kai
        mkdir -p dist
        BIN_PATH=$(stack path --local-install-root)/bin/kai
        cp "$BIN_PATH" dist/kai-ci
    
    - name: Test built binary
      run: |
        VERSION=$(grep '^version:' package.yaml | cut -d' ' -f2)
        bash scripts/test-release-binary.sh ./dist/kai-ci "$VERSION"
