name: Build and Release Binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      should-release: ${{ steps.check-release.outputs.should-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get version from package.yaml
        id: get-version
        run: |
          VERSION=$(grep '^version:' package.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"
      
      - name: Check release completeness
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get-version.outputs.version }}"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG points to $TAG_COMMIT instead of $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          EXISTING_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          MISSING_ASSETS=0
          for ASSET_PATTERN in '^kai-linux-' '^kai-macos-' '^kai-windows-.*\.exe$'; do
            if ! grep -Eq "$ASSET_PATTERN" <<< "$EXISTING_ASSETS"; then
              echo "Release $TAG has no asset matching $ASSET_PATTERN"
              MISSING_ASSETS=$((MISSING_ASSETS + 1))
            fi
          done

          if [ "$MISSING_ASSETS" -eq 0 ]; then
            echo "Release $TAG already has every platform asset, skipping"
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG is absent or incomplete, proceeding"
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi

  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v3
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}

      - name: Run full test suite
        run: stack test --fast

      - name: Validate benchmark programs
        run: stack bench --benchmark-arguments="--iters 1"

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [check-version, validate]
    if: needs.check-version.outputs.should-release == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Haskell (Stack)
      # Uses the same action as the Pages workflow
      # Ensures GHC/Stack are available across platforms
      
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v3
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}

      - name: Build CLI binary
        shell: bash
        run: |
          stack --no-terminal build :kai
          mkdir -p dist
          BINARY_NAME=$(bash scripts/release-asset-name.sh "${{ runner.os }}" "${{ runner.arch }}")
          # Locate the built binary (Windows adds .exe extension)
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_PATH=$(stack path --local-install-root)/bin/kai.exe || true
            if [ ! -x "$BIN_PATH" ]; then
              BIN_PATH=$(stack path --local-bin)/kai.exe || true
            fi
          else
            BIN_PATH=$(stack path --local-install-root)/bin/kai || true
            if [ ! -x "$BIN_PATH" ]; then
              BIN_PATH=$(stack path --local-bin)/kai || true
            fi
          fi
          if [ ! -x "$BIN_PATH" ]; then
            echo "Binary not found" >&2; exit 1
          fi
          cp "$BIN_PATH" "dist/$BINARY_NAME"
          echo "Prepared release binary: $BINARY_NAME"
          
          # Test the binary on all .kai test files
          echo "Testing binary functionality on all test files..."
          FAILED_TESTS=0
          TOTAL_TESTS=0

          for test_file in tests/*.kai; do
            if [ -f "$test_file" ]; then
              TOTAL_TESTS=$((TOTAL_TESTS + 1))

              echo "Running test: $test_file"

              if [[ "$test_file" == tests/input* ]]; then
                case "$test_file" in
                  "tests/input_boolean_logic.kai")
                    # This test has two input calls: (input == "yes") and not (input == "no")
                    TEST_INPUT="yes\nyes"
                    ;;
                  "tests/input_comparison_chain.kai")
                    # This test has two input calls: (input == "a") or (input == "b")
                    TEST_INPUT="a\na"
                    ;;
                  "tests/input_empty_handling.kai")
                    # This test needs an empty line, not empty string
                    TEST_INPUT=""
                    ;;
                  "tests/input_nested_conditionals.kai")
                    # This test has two input calls in nested conditionals
                    TEST_INPUT="admin\nadmin"
                    ;;
                  *)
                    TEST_INPUT="test_input"
                    ;;
                esac

                if [[ "$test_file" == "tests/input_empty_handling.kai" ]]; then
                  # Special handling for empty input test
                  if ! echo | ./dist/$BINARY_NAME "$test_file" >/dev/null 2>&1; then
                    echo "❌ FAILED: $test_file (with empty input)"
                    FAILED_TESTS=$((FAILED_TESTS + 1))
                  else
                    echo "✅ PASSED: $test_file (with empty input)"
                  fi
                else
                  if ! printf "$TEST_INPUT" | ./dist/$BINARY_NAME "$test_file" >/dev/null 2>&1; then
                    echo "❌ FAILED: $test_file (with input: '$TEST_INPUT')"
                    FAILED_TESTS=$((FAILED_TESTS + 1))
                  else
                    echo "✅ PASSED: $test_file (with input: '$TEST_INPUT')"
                  fi
                fi
              else
                if ! ./dist/$BINARY_NAME "$test_file" >/dev/null 2>&1; then
                  echo "❌ FAILED: $test_file"
                  FAILED_TESTS=$((FAILED_TESTS + 1))
                else
                  echo "✅ PASSED: $test_file"
                fi
              fi
            fi
          done

          PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS))

          echo "Test Results: $PASSED_TESTS/$TOTAL_TESTS passed"
          if [ $FAILED_TESTS -gt 0 ]; then
            echo "❌ $FAILED_TESTS test(s) failed. Aborting release."
            exit 1
          fi
          echo "✅ All binary tests passed! (Input tests provided with 'test_input')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create or reuse tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          TAG=${{ needs.check-version.outputs.tag }}
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG points to $TAG_COMMIT instead of $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Reusing existing tag $TAG"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: "Kai v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          overwrite_files: true
          files: |
            artifacts/**/kai-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
