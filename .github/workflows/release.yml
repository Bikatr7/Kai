name: Build and Release Binaries

on:
  push:
    branches:
      - master
    paths:
      - package.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kai-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      should-release: ${{ steps.check-release.outputs.should-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.yaml
        id: get-version
        run: |
          VERSION=$(grep '^version:' package.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found version: $VERSION"

      - name: Check release completeness
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get-version.outputs.version }}"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG points to $TAG_COMMIT instead of $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          EXISTING_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          MISSING_ASSETS=0
          for ASSET in \
            kai-linux-amd64.tar.gz \
            kai-macos-arm64.zip \
            kai-windows-amd64.zip \
            SHA256SUMS
          do
            if ! grep -Fqx "$ASSET" <<< "$EXISTING_ASSETS"; then
              echo "Release $TAG is missing $ASSET"
              MISSING_ASSETS=$((MISSING_ASSETS + 1))
            fi
          done

          if [ "$IS_DRAFT" = "false" ] && [ "$MISSING_ASSETS" -eq 0 ]; then
            echo "Release $TAG is published with every expected asset, skipping"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG is absent, draft, or incomplete; proceeding"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate release candidate
    runs-on: ubuntu-22.04
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: validate-ubuntu-22.04-stack-${{ hashFiles('stack.yaml.lock') }}

      - name: Run full test suite
        run: stack test --fast

      - name: Validate benchmark programs
        run: stack bench --benchmark-arguments="--iters 1"

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [check-version, validate]
    if: needs.check-version.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            expected-package: kai-linux-amd64.tar.gz
            macos-target: ''
          - os: macos-15
            expected-package: kai-macos-arm64.zip
            macos-target: '11.3'
          - os: windows-2022
            expected-package: kai-windows-amd64.zip
            macos-target: ''
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-target }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell (Stack)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ matrix.os }}-${{ runner.arch }}-macos-${{ matrix.macos-target }}-stack-${{ hashFiles('stack.yaml.lock') }}

      - name: Build CLI binary
        id: prepare
        shell: bash
        run: |
          stack --no-terminal build :kai
          mkdir -p dist/bin dist/release
          BINARY_NAME=$(bash scripts/release-asset-name.sh "${{ runner.os }}" "${{ runner.arch }}")
          PACKAGE_NAME=$(bash scripts/release-package-name.sh "${{ runner.os }}" "${{ runner.arch }}")
          if [ "$PACKAGE_NAME" != "${{ matrix.expected-package }}" ]; then
            echo "Unexpected package name: $PACKAGE_NAME" >&2
            exit 1
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_PATH=$(stack path --local-install-root)/bin/kai.exe
            TARGET_PATH=dist/bin/kai.exe
          else
            BIN_PATH=$(stack path --local-install-root)/bin/kai
            TARGET_PATH=dist/bin/kai
          fi
          if [ ! -x "$BIN_PATH" ]; then
            echo "Binary not found: $BIN_PATH" >&2
            exit 1
          fi

          cp "$BIN_PATH" "$TARGET_PATH"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod 755 "$TARGET_PATH"
          fi
          echo "binary_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release binary: $BINARY_NAME"

      - name: Test built binary
        shell: bash
        run: bash scripts/test-release-binary.sh "${{ steps.prepare.outputs.binary_path }}" "${{ needs.check-version.outputs.version }}"

      - name: Verify macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUILD_INFO=$(xcrun vtool -show-build "${{ steps.prepare.outputs.binary_path }}")
          printf '%s\n' "$BUILD_INFO"
          grep -Eq 'minos[[:space:]]+11\.3([[:space:]]|$)' <<< "$BUILD_INFO"

      - name: Sign and notarize macOS binary
        if: runner.os == 'macOS' && vars.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?missing Apple signing certificate}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?missing Apple certificate password}"
          : "${APPLE_SIGNING_IDENTITY:?missing Apple signing identity}"
          : "${APPLE_NOTARY_KEY_P8_BASE64:?missing Apple notary key}"
          : "${APPLE_NOTARY_KEY_ID:?missing Apple notary key ID}"
          : "${APPLE_NOTARY_ISSUER_ID:?missing Apple notary issuer ID}"

          CERTIFICATE_PATH="$RUNNER_TEMP/kai-developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/kai-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          NOTARY_ARCHIVE="$RUNNER_TEMP/kai-notarization.zip"
          trap 'security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true' EXIT

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "${{ steps.prepare.outputs.binary_path }}"
          codesign --verify --strict --verbose=2 "${{ steps.prepare.outputs.binary_path }}"

          ditto -c -k --norsrc "${{ steps.prepare.outputs.binary_path }}" "$NOTARY_ARCHIVE"
          xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          spctl --assess --type execute --verbose=2 "${{ steps.prepare.outputs.binary_path }}"

      - name: Authenticode-sign Windows binary
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            throw "Missing WINDOWS_CERTIFICATE_PFX_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_PASSWORD)) {
            throw "Missing WINDOWS_CERTIFICATE_PFX_PASSWORD"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "kai-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) {
              throw "signtool.exe was not found"
            }

            & $signTool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ steps.prepare.outputs.binary_path }}"
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed with exit code $LASTEXITCODE"
            }
            & $signTool.FullName verify /pa /v "${{ steps.prepare.outputs.binary_path }}"
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed"
            }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Package release binary
        id: package
        shell: bash
        run: |
          PACKAGE_PATH=$(bash scripts/package-release-binary.sh \
            "${{ runner.os }}" \
            "${{ runner.arch }}" \
            "${{ steps.prepare.outputs.binary_path }}" \
            dist/release)
          if [ "$(basename "$PACKAGE_PATH")" != "${{ steps.prepare.outputs.package_name }}" ]; then
            echo "Packager returned an unexpected asset: $PACKAGE_PATH" >&2
            exit 1
          fi
          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error

  release:
    needs: [check-version, build]
    runs-on: ubuntu-22.04
    if: needs.check-version.outputs.should-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or reuse tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          TAG=${{ needs.check-version.outputs.tag }}
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG points to $TAG_COMMIT instead of $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Reusing existing tag $TAG"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets and checksums
        run: |
          mkdir -p release-files
          find artifacts -type f -name 'kai-*' -exec cp '{}' release-files/ \;
          for ASSET in \
            kai-linux-amd64.tar.gz \
            kai-macos-arm64.zip \
            kai-windows-amd64.zip
          do
            if [ ! -f "release-files/$ASSET" ]; then
              echo "Missing release asset: $ASSET" >&2
              exit 1
            fi
          done
          (
            cd release-files
            sha256sum kai-* > SHA256SUMS
          )

      - name: Create or update draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: "Kai v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          draft: true
          make_latest: false
          overwrite_files: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Verify draft package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [check-version, release]
    if: needs.check-version.outputs.should-release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            package: kai-linux-amd64.tar.gz
          - os: macos-15
            package: kai-macos-arm64.zip
          - os: windows-2022
            package: kai-windows-amd64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify release package
        id: extract
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloaded extracted
          gh release download "${{ needs.check-version.outputs.tag }}" \
            --pattern "${{ matrix.package }}" \
            --pattern SHA256SUMS \
            --dir downloaded \
            --clobber

          EXPECTED_SHA=$(awk -v file="${{ matrix.package }}" '$2 == file { print $1 }' downloaded/SHA256SUMS)
          if [ -z "$EXPECTED_SHA" ]; then
            echo "SHA256SUMS has no entry for ${{ matrix.package }}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL_SHA=$(sha256sum "downloaded/${{ matrix.package }}" | awk '{ print $1 }')
          else
            ACTUAL_SHA=$(shasum -a 256 "downloaded/${{ matrix.package }}" | awk '{ print $1 }')
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Checksum mismatch for ${{ matrix.package }}" >&2
            exit 1
          fi

          BINARY_PATH=$(bash scripts/extract-release-package.sh \
            "${{ runner.os }}" \
            "downloaded/${{ matrix.package }}" \
            extracted)
          if [ "${{ runner.os }}" != "Windows" ] && [ ! -x "$BINARY_PATH" ]; then
            echo "Executable permission was not preserved: $BINARY_PATH" >&2
            exit 1
          fi
          echo "binary_path=$BINARY_PATH" >> "$GITHUB_OUTPUT"

      - name: Test exact downloaded binary
        shell: bash
        run: bash scripts/test-release-binary.sh "${{ steps.extract.outputs.binary_path }}" "${{ needs.check-version.outputs.version }}"

      - name: Verify downloaded macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUILD_INFO=$(xcrun vtool -show-build "${{ steps.extract.outputs.binary_path }}")
          printf '%s\n' "$BUILD_INFO"
          grep -Eq 'minos[[:space:]]+11\.3([[:space:]]|$)' <<< "$BUILD_INFO"
          codesign --verify --strict --verbose=2 "${{ steps.extract.outputs.binary_path }}"

      - name: Verify macOS Gatekeeper assessment
        if: runner.os == 'macOS' && vars.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          xattr -w com.apple.quarantine "0081;$(date +%s);KaiReleaseVerification;" "${{ steps.extract.outputs.binary_path }}"
          spctl --assess --type execute --verbose=2 "${{ steps.extract.outputs.binary_path }}"

      - name: Verify downloaded Windows signature
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "${{ steps.extract.outputs.binary_path }}"
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Downloaded binary has invalid Authenticode status: $($signature.Status)"
          }

  publish-release:
    needs: [check-version, verify-release]
    runs-on: ubuntu-22.04
    if: needs.check-version.outputs.should-release == 'true'
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.check-version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
